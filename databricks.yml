# This is a Declarative Automation Bundle definition for dbx_gen_ai.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dbx_gen_ai
  uuid: be20fe55-98c5-4e11-8187-172aa2e656df

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1bad97f9-c4ac.cloud.databricks.com
    variables:
      catalog: gen-ai-dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-1bad97f9-c4ac.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/chris_austin2004@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/chris_austin2004@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: gen-ai-prod
      schema: prod
    permissions:
      - user_name: chris_austin2004@hotmail.com
        level: CAN_MANAGE
